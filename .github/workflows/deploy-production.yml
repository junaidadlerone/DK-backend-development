name: Deploy to Production

on:
  push:
    branches:
      - production

jobs:
  deploy:
    name: Deploy Migrations & Edge Functions
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PROD_SUPABASE_DB_PASSWORD }}
      PROJECT_REF: iywivotqnphrjijztxtu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to production project
        run: supabase link --project-ref $PROJECT_REF

      - name: Push database migrations
        run: |
          echo "🔍 Checking for orphaned remote migrations..."

          # Get all migration versions applied on the remote DB
          REMOTE_VERSIONS=$(supabase migration list 2>&1 | grep -oE '[0-9]{14}' | sort -u || true)

          # Get all migration versions that exist as local files
          LOCAL_VERSIONS=$(ls supabase/migrations/*.sql 2>/dev/null | grep -oE '[0-9]{14}' | sort -u || true)

          # Repair any remote version that has no corresponding local file
          for version in $REMOTE_VERSIONS; do
            if ! echo "$LOCAL_VERSIONS" | grep -qx "$version"; then
              echo "🔧 Repairing orphaned migration: $version"
              supabase migration repair --status reverted "$version"
            fi
          done

          echo "🚀 Pushing migrations..."
          supabase db push --password "$SUPABASE_DB_PASSWORD" --include-all
          echo "✅ Migrations pushed successfully."

      - name: Deploy all edge functions
        run: |
          for dir in supabase/functions/*/; do
            func=$(basename "$dir")
            if [ "$func" = "_shared" ]; then
              continue
            fi
            echo "🚀 Deploying function: $func"
            supabase functions deploy "$func" --no-verify-jwt --project-ref $PROJECT_REF
          done
