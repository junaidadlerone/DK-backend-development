name: Deploy Docs to External Repository

on:
  push:
    branches:
      - development
    paths:
      - "supabase/functions/docs/**"
      - ".github/workflows/deployment.yml"
  pull_request:
    branches:
      - development
    paths:
      - "supabase/functions/docs/**"
      - ".github/workflows/deployment.yml"

jobs:
  deploy-docs:
    runs-on: ubuntu-latest

    # Only run on push events, not on PRs (to avoid deploying from PRs)
    if: github.event_name == 'push'

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone target repository
        env:
          TARGET_REPO: junaiiiid/door-knocker-api-docs
          GITHUB_TOKEN: ${{ secrets.DOCS_DEPLOY_TOKEN }}
        run: |
          git clone https://${GITHUB_TOKEN}@github.com/${TARGET_REPO}.git target-repo
          cd target-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync docs folder to target repository
        run: |
          # Remove all files from target repo except .git
          find target-repo -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          # Copy all files from supabase/functions/docs/ to target repo
          cp -r supabase/functions/docs/* target-repo/

          # Verify files were copied
          ls -la target-repo/

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.DOCS_DEPLOY_TOKEN }}
        run: |
          cd target-repo

          # Add all changes
          git add -A

          # Check if there are any changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Commit with a meaningful message
          git commit -m "Update docs from development branch

          Source commit: ${{ github.sha }}
          Triggered by: ${{ github.actor }}
          Workflow: ${{ github.workflow }}
          Repository: ${{ github.repository }}"

          # Configure remote URL with token for authentication
          git remote set-url origin https://${GITHUB_TOKEN}@github.com/junaiiiid/door-knocker-api-docs.git

          # Push to target repository
          git push origin main

      - name: Report deployment status
        if: success()
        run: |
          echo "✅ Documentation deployed successfully!"
          echo "📚 View at: https://junaiiiid.github.io/door-knocker-api-docs/"

      - name: Report deployment failure
        if: failure()
        run: |
          echo "❌ Documentation deployment failed!"
          echo "Please check the logs above for details."
