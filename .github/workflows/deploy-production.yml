name: Deploy to Production

on:
  push:
    branches:
      - production

jobs:
  deploy:
    name: Deploy Migrations & Edge Functions
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PROD_SUPABASE_DB_PASSWORD }}
      PROJECT_REF: iywivotqnphrjijztxtu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to production project
        run: supabase link --project-ref $PROJECT_REF

      - name: Push database migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy all edge functions
        run: |
          for dir in supabase/functions/*/; do
            # Skip the _shared directory
            func=$(basename "$dir")
            if [ "$func" = "_shared" ]; then
              continue
            fi
            echo "Deploying function: $func"
            supabase functions deploy "$func" --no-verify-jwt --project-ref $PROJECT_REF
          done
